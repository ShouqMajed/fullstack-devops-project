apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: fullstack-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
        - name: app-backend
          image: shouqmajed/app-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # بدل localhost في application.properties
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/mydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: fullstack-app
spec:
  selector:
    app: app-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
